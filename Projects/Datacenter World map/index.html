<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #132240;
    --navy-light: #1a3058;
    --blue: #4a9edd;
    --blue-light: #7ec8f0;
    --blue-glow: #3b8fd4;
    --blue-pale: #d0ebfa;
    --gray-100: #f4f6f9;
    --gray-200: #e2e6ed;
    --gray-300: #c5ccd8;
    --gray-400: #8e99ab;
    --gray-500: #5c6a7e;
    --gray-600: #3d4a5c;
    --shadow: 0 4px 24px rgba(10,22,40,0.18);
    --shadow-lg: 0 8px 40px rgba(10,22,40,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--gray-100);
    height: 100vh;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100vh;
    z-index: 1;
  }

  /* --- Top Bar --- */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 14px 24px;
    background: linear-gradient(180deg, rgba(10,22,40,0.97) 0%, rgba(10,22,40,0.88) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(74,158,221,0.12);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .brand-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 2px 12px rgba(74,158,221,0.3);
  }

  .brand-text {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
    color: var(--gray-100);
    white-space: nowrap;
  }

  .brand-text span {
    color: var(--blue);
  }

  /* --- Search --- */
  .search-wrapper {
    position: relative;
    width: 340px;
    flex-shrink: 0;
  }

  .search-wrapper svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    stroke: var(--gray-400);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    background: var(--navy-mid);
    border: 1px solid rgba(74,158,221,0.15);
    border-radius: 10px;
    color: var(--gray-100);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input::placeholder { color: var(--gray-400); }

  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(74,158,221,0.12);
  }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--navy-mid);
    border: 1px solid rgba(74,158,221,0.18);
    border-radius: 10px;
    max-height: 280px;
    overflow-y: auto;
    display: none;
    box-shadow: var(--shadow-lg);
  }

  .search-results.active { display: block; }

  .search-result-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(74,158,221,0.06);
    transition: background 0.15s;
  }

  .search-result-item:hover { background: var(--navy-light); }

  .search-result-item:last-child { border-bottom: none; }

  .sr-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--gray-100);
  }

  .sr-meta {
    font-size: 11.5px;
    color: var(--gray-400);
    margin-top: 2px;
  }

  /* --- Filter Toggles --- */
  .filters {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .filter-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(74,158,221,0.15);
    background: var(--navy-mid);
    color: var(--gray-300);
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }

  .filter-btn:hover {
    border-color: var(--blue);
    color: var(--blue-light);
  }

  .filter-btn.active {
    background: linear-gradient(135deg, rgba(74,158,221,0.18) 0%, rgba(74,158,221,0.08) 100%);
    border-color: var(--blue);
    color: var(--blue-light);
    box-shadow: 0 0 12px rgba(74,158,221,0.1);
  }

  /* --- Stats Bar --- */
  .stats-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    gap: 2px;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(74,158,221,0.12);
    border-radius: 12px;
    padding: 4px;
    box-shadow: var(--shadow-lg);
  }

  .stat-chip {
    padding: 8px 18px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--gray-300);
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }

  .stat-chip .num {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    color: var(--blue-light);
  }

  /* --- Leaflet Overrides --- */
  .leaflet-popup-content-wrapper {
    background: var(--navy-mid) !important;
    border: 1px solid rgba(74,158,221,0.2) !important;
    border-radius: 12px !important;
    box-shadow: var(--shadow-lg) !important;
    color: var(--gray-100) !important;
    padding: 0 !important;
  }

  .leaflet-popup-tip {
    background: var(--navy-mid) !important;
    border: 1px solid rgba(74,158,221,0.2) !important;
    box-shadow: none !important;
  }

  .leaflet-popup-content {
    margin: 0 !important;
    font-family: 'DM Sans', sans-serif !important;
    min-width: 220px;
  }

  .popup-inner {
    padding: 16px 18px;
  }

  .popup-name {
    font-weight: 700;
    font-size: 14.5px;
    color: var(--gray-100);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .popup-operator {
    font-size: 12px;
    color: var(--blue);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .popup-stats {
    display: flex;
    gap: 16px;
  }

  .popup-stat {
    display: flex;
    flex-direction: column;
  }

  .popup-stat-label {
    font-size: 10px;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .popup-stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--blue-light);
  }

  .popup-location {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(74,158,221,0.1);
    font-size: 12px;
    color: var(--gray-400);
  }

  .leaflet-control-zoom a {
    background: var(--navy-mid) !important;
    color: var(--blue-light) !important;
    border-color: rgba(74,158,221,0.15) !important;
    font-size: 16px !important;
    width: 36px !important;
    height: 36px !important;
    line-height: 36px !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--navy-light) !important;
  }

  .leaflet-control-attribution {
    background: rgba(10,22,40,0.8) !important;
    color: var(--gray-500) !important;
    font-size: 10px !important;
  }

  .leaflet-control-attribution a { color: var(--gray-400) !important; }

  /* --- Scrollbar --- */
  .search-results::-webkit-scrollbar { width: 6px; }
  .search-results::-webkit-scrollbar-track { background: transparent; }
  .search-results::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 3px; }

  /* --- Responsive --- */
  @media (max-width: 900px) {
    .top-bar { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    .brand { display: none; }
    .search-wrapper { width: 100%; order: -1; }
    .filters { flex-wrap: wrap; justify-content: center; }
    .filter-btn { padding: 6px 12px; font-size: 11.5px; }
    .stats-bar { bottom: 12px; }
    .stat-chip { padding: 6px 12px; font-size: 11px; }
    .stat-chip .num { font-size: 12.5px; }
  }
</style>
</head>

<div class="top-bar">

</div>

// ============================================================
// MAP SETUP
// ============================================================
const map = L.map('map', {
  center: [25, 10],
  zoom: 3,
  minZoom: 2,
  maxZoom: 18,
  zoomControl: false,
  attributionControl: true,
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ============================================================
// MARKERS
// ============================================================
let markers = [];
let activeFilter = 'all';

function getRadius(capacity) {
  if (capacity >= 300) return 10;
  if (capacity >= 100) return 7.5;
  if (capacity >= 50) return 6;
  return 4.5;
}

function getColor(capacity) {
  if (capacity >= 300) return '#7ec8f0';
  if (capacity >= 100) return '#4a9edd';
  if (capacity >= 50) return '#3b8fd4';
  return '#2e78b5';
}

function createPopup(dc) {
  return `<div class="popup-inner">
    <div class="popup-name">${dc.name}</div>
    <div class="popup-operator">${dc.operator}</div>
    <div class="popup-stats">
      <div class="popup-stat">
        <span class="popup-stat-label">Capacity</span>
        <span class="popup-stat-val">${dc.capacity} MW</span>
      </div>
      <div class="popup-stat">
        <span class="popup-stat-label">Category</span>
        <span class="popup-stat-val">${dc.capacity >= 300 ? 'Mega' : dc.capacity >= 50 ? 'Large' : 'Standard'}</span>
      </div>
    </div>
    <div class="popup-location">📍 ${dc.location}</div>
  </div>`;
}

function filterCategory(dc) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'small') return dc.capacity < 50;
  if (activeFilter === 'medium') return dc.capacity >= 50 && dc.capacity <= 300;
  if (activeFilter === 'large') return dc.capacity > 300;
  return true;
}

function renderMarkers() {
  // Remove old
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  let visibleCount = 0;
  const countries = new Set();
  let totalCap = 0;

  datacenters.forEach(dc => {
    if (!filterCategory(dc)) return;

    visibleCount++;
    const countryPart = dc.location.split(',').pop().trim();
    countries.add(countryPart);
    totalCap += dc.capacity;

    const marker = L.circleMarker([dc.lat, dc.lng], {
      radius: getRadius(dc.capacity),
      fillColor: getColor(dc.capacity),
      fillOpacity: 0.85,
      color: '#7ec8f0',
      weight: 1.2,
      opacity: 0.5,
    }).addTo(map);

    marker.bindPopup(createPopup(dc), { closeButton: false, maxWidth: 280 });

    marker.on('mouseover', function() {
      this.setStyle({ fillOpacity: 1, weight: 2.5, opacity: 1 });
      this.setRadius(getRadius(dc.capacity) + 3);
    });
    marker.on('mouseout', function() {
      this.setStyle({ fillOpacity: 0.85, weight: 1.2, opacity: 0.5 });
      this.setRadius(getRadius(dc.capacity));
    });

    marker._dcData = dc;
    markers.push(marker);
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('countryCount').textContent = countries.size;
  document.getElementById('totalCapacity').textContent = (totalCap / 1000).toFixed(1);
}

renderMarkers();

// ============================================================
// FILTERS
// ============================================================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderMarkers();
  });
});

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) {
    searchResults.classList.remove('active');
    return;
  }

  const matched = datacenters.filter(dc =>
    dc.name.toLowerCase().includes(q) ||
    dc.operator.toLowerCase().includes(q) ||
    dc.location.toLowerCase().includes(q)
  ).slice(0, 8);

  if (matched.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item" style="color:var(--gray-400);cursor:default;">No results found</div>';
  } else {
    searchResults.innerHTML = matched.map(dc => `
      <div class="search-result-item" data-lat="${dc.lat}" data-lng="${dc.lng}" data-name="${dc.name}">
        <div class="sr-name">${dc.name}</div>
        <div class="sr-meta">${dc.operator} · ${dc.capacity} MW · ${dc.location}</div>
      </div>
    `).join('');
  }

  searchResults.classList.add('active');
});

searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('.search-result-item');
  if (!item || !item.dataset.lat) return;

  const lat = parseFloat(item.dataset.lat);
  const lng = parseFloat(item.dataset.lng);
  const name = item.dataset.name;

  map.flyTo([lat, lng], 10, { duration: 1.5 });

  // Open the matching marker popup
  markers.forEach(m => {
    if (m._dcData && m._dcData.name === name) {
      setTimeout(() => m.openPopup(), 800);
    }
  });

  searchResults.classList.remove('active');
  searchInput.value = item.querySelector('.sr-name').textContent;
});

// Close search on outside click
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) {
    searchResults.classList.remove('active');
  }
});

// Close search on Escape
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchResults.classList.remove('active');
    searchInput.blur();
  }
});
</script>
