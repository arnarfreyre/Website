<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountains of Iceland</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <!-- Local styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app-container">

  <!-- Full viewport map -->
  <div id="map"></div>

  <!-- Controls overlay positioned absolute over map -->
  <div class="controls-overlay">

    <!-- Search bar at top center -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search mountains..." autocomplete="off" spellcheck="false">
    </div>

    <!-- Filter toggle buttons -->
    <div class="filter-container">
      <button class="filter-btn filter-btn--small active" data-category="small">
        <span class="filter-dot"></span> Small &lt; 500m
      </button>
      <button class="filter-btn filter-btn--medium active" data-category="medium">
        <span class="filter-dot"></span> Medium 500&ndash;1000m
      </button>
      <button class="filter-btn filter-btn--large active" data-category="large">
        <span class="filter-dot"></span> Large &gt; 1000m
      </button>
    </div>

    <!-- Mountain count -->
    <div id="mountain-count" class="mountain-count"></div>

  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p class="loading-text">Loading mountains...</p>
    </div>
  </div>

  <!-- Error overlay (hidden by default) -->
  <div id="error-overlay" class="hidden">
    <div class="error-content">
      <p id="error-message">Failed to load mountain data.</p>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>
  </div>

</div>

<!-- CDN JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Local JS -->
<script src="app.js"></script>

</body>
</html>
