<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iceland CPI Similarity</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* HEADER */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(12, 14, 30, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
      padding: 10px 24px 12px;
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.02em;
    }
    .title span { color: #ef5350; }
    .subtitle {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      margin: 2px 0 0;
      font-weight: 400;
    }

    /* PAGE TOGGLE */
    .page-toggle {
      display: flex;
      gap: 4px;
    }
    .page-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.55);
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .page-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
    }
    .page-btn.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* VIEW TABS */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.55);
      padding: 7px 16px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .tab:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .tab.active[data-view="knn"] {
      background: rgba(33, 150, 243, 0.2);
      border-color: rgba(33, 150, 243, 0.45);
      color: #90caf9;
      box-shadow: 0 0 20px rgba(33, 150, 243, 0.15);
    }
    .tab.active[data-view="cluster"] {
      background: rgba(0, 150, 136, 0.2);
      border-color: rgba(0, 150, 136, 0.45);
      color: #80cbc4;
      box-shadow: 0 0 20px rgba(0, 150, 136, 0.15);
    }
    .tab.active[data-view="correlation"] {
      background: rgba(76, 175, 80, 0.2);
      border-color: rgba(76, 175, 80, 0.45);
      color: #a5d6a7;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.15);
    }
    .tab.active[data-view="combined"] {
      background: rgba(239, 83, 80, 0.2);
      border-color: rgba(239, 83, 80, 0.45);
      color: #ef9a9a;
      box-shadow: 0 0 20px rgba(239, 83, 80, 0.15);
    }

    /* TOP N ROW */
    .top-n-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }
    .top-n-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      margin-right: 4px;
    }
    .top-n-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.45);
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .top-n-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
    }
    .top-n-btn.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* GLASS PANELS */
    .glass-panel {
      position: fixed;
      z-index: 1000;
      background: rgba(12, 14, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      color: #e0e0e0;
      padding: 16px;
      font-size: 0.82rem;
      transition: opacity 0.3s ease;
    }
    #info-panel {
      top: 135px;
      right: 16px;
      width: 270px;
      min-height: 60px;
    }
    #info-panel h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: #fff;
    }
    #info-panel .info-iso {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    #info-panel .info-pop {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }
    #info-panel hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 8px 0;
    }
    .metric { font-size: 0.82rem; margin: 4px 0; }
    .metric strong { color: #fff; font-weight: 600; }
    .metric.muted { color: rgba(255,255,255,0.35); }
    .metric.highlight { color: #ef5350; font-weight: 600; }
    .metric-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      margin: 4px 0 6px;
      overflow: hidden;
    }
    .metric-bar div {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1565c0, #64b5f6);
      transition: width 0.4s ease;
    }
    .metric-bar.green div { background: linear-gradient(90deg, #2e7d32, #81c784); }
    .metric-bar.red div { background: linear-gradient(90deg, #c62828, #ef9a9a); }
    .rank { font-size: 0.72rem; color: rgba(255,255,255,0.45); }
    .badge {
      display: inline-block;
      background: rgba(239, 83, 80, 0.2);
      border: 1px solid rgba(239, 83, 80, 0.4);
      color: #ef9a9a;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }
    .default-hint { color: rgba(255,255,255,0.3); font-size: 0.78rem; }

    #legend { bottom: 30px; right: 16px; width: 220px; }
    .legend-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #fff; }
    .legend-gradient {
      width: 100%; height: 14px; border-radius: 4px; margin: 6px 0 4px;
    }
    .legend-labels {
      display: flex; justify-content: space-between;
      font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-bottom: 6px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      margin: 4px 0; font-size: 0.75rem; color: rgba(255,255,255,0.65);
    }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #method-info {
      bottom: 30px; left: 16px; max-width: 320px;
      font-size: 0.72rem; color: rgba(255,255,255,0.45); padding: 12px 16px;
    }

    /* LEAFLET OVERRIDES */
    .leaflet-container { background: #0a0a1a !important; }
    .leaflet-interactive {
      transition: fill 0.35s ease, fill-opacity 0.35s ease, stroke 0.15s ease, stroke-width 0.15s ease;
    }
    .leaflet-control-zoom a {
      background: rgba(12, 14, 30, 0.85) !important;
      color: #ccc !important;
      border-color: rgba(255,255,255,0.1) !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(30, 32, 50, 0.9) !important;
      color: #fff !important;
    }

    /* ICELAND MARKER */
    .iceland-pin {
      width: 22px; height: 22px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .iceland-pin .core {
      width: 10px; height: 10px; background: #ff4444;
      border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(255, 68, 68, 0.6);
      z-index: 2; position: relative;
    }
    .iceland-pin .ring {
      position: absolute; border: 2px solid rgba(255, 68, 68, 0.5);
      border-radius: 50%; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-ring 2.5s ease-out infinite;
    }
    .iceland-pin .ring:nth-child(3) { animation-delay: 1.25s; }
    @keyframes pulse-ring {
      0%   { width: 12px; height: 12px; opacity: 1; }
      100% { width: 50px; height: 50px; opacity: 0; }
    }

    /* TOOLTIP */
    .country-tooltip {
      background: rgba(12, 14, 30, 0.92) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 8px !important;
      color: #e0e0e0 !important;
      font-family: 'Segoe UI', system-ui, sans-serif !important;
      font-size: 0.75rem !important;
      padding: 6px 10px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
    }
    .country-tooltip::before { display: none !important; }

    /* LOADING */
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2000; background: #0f0f23;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ef5350;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 0.85rem; color: rgba(255,255,255,0.5); }

    /* DATA PAGE */
    #data-page {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: #0f0f23;
      overflow-y: auto;
      padding: 140px 24px 40px;
      display: none;
    }
    .data-container { max-width: 1200px; margin: 0 auto; }
    .data-summary {
      background: rgba(12, 14, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      font-size: 0.82rem;
    }
    .summary-stat { text-align: center; }
    .summary-stat .value {
      font-size: 1.4rem; font-weight: 700; color: #fff;
    }
    .summary-stat .label {
      font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 2px;
    }
    .data-controls { margin-bottom: 12px; }
    #search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e0e0e0;
      padding: 8px 14px;
      font-size: 0.82rem;
      width: 300px;
      font-family: inherit;
      outline: none;
    }
    #search-input:focus { border-color: rgba(255, 255, 255, 0.25); }
    #search-input::placeholder { color: rgba(255,255,255,0.3); }
    .table-wrapper { overflow-x: auto; }
    #data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    #data-table th {
      position: sticky; top: 0;
      background: rgba(12, 14, 30, 0.95);
      padding: 10px 12px; text-align: left;
      font-weight: 600; color: rgba(255,255,255,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    #data-table th:hover { color: #fff; }
    .sort-icon::after { content: ''; }
    .sort-asc .sort-icon::after { content: ' \25B2'; font-size: 0.6rem; }
    .sort-desc .sort-icon::after { content: ' \25BC'; font-size: 0.6rem; }
    #data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.75);
    }
    #data-table tr:hover td { background: rgba(255, 255, 255, 0.04); }
    #data-table tr.cluster-match td { background: rgba(0, 150, 136, 0.08); }
    #data-table tr.cluster-match td:nth-child(8) { color: #80cbc4; font-weight: 600; }
  </style>
</head>

  <div id="loading">
    <div class="loader"></div>
    <div class="loader-text">Loading world map data...</div>
  </div>

  <header id="header">
    <div class="header-content">
      <div class="header-top">
        <div>
          <h1 class="title"><span>Iceland</span> CPI Similarity</h1>
          <p class="subtitle">K-Nearest Neighbors, Clustering & Correlation Analysis</p>
        </div>
        <nav class="page-toggle">
          <button class="page-btn active" data-page="map">Map</button>
          <button class="page-btn" data-page="data">Data Table</button>

      <nav class="tabs" id="view-tabs">
        <button class="tab active" data-view="knn">KNN Distance</button>

        <button class="tab" data-view="combined">Combined</button>

      <nav class="top-n-row" id="top-n-row">

  <div id="map"></div>

      <div class="table-wrapper">

              <th data-col="corr" class="sortable">Correlation <span class="sort-icon"></span></th>
              <th data-col="same_cluster" class="sortable">Cluster <span class="sort-icon"></span></th>
              <th data-col="combined" class="sortable">Combined <span class="sort-icon"></span></th>
              <th data-col="methods_top30" class="sortable">Top30 <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="data-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="legend" class="glass-panel"></div>

    <p id="method-text"></p>
  </div>

  /* DERIVED LOOKUPS */
  const META = ANALYSIS_DATA.metadata;
  const COUNTRIES = ANALYSIS_DATA.countries;
  const ALL_ISOS = Object.keys(COUNTRIES);
  const POPULATIONS = ANALYSIS_DATA.populations;
  const NAME_OVERRIDES = ANALYSIS_DATA.name_overrides;
  const ICELAND_COORDS = [64.96, -19.02];
  const GEOJSON_URL = 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json';

  /* STATE */
  let currentView = 'knn';
  let currentTopN = 30;
  let currentPage = 'map';
  let geojsonLayer = null;

  /* COLOR UTILITIES */
  function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }
  function lerpHSL(t, h1, s1, l1, h2, s2, l2) {
    return hsl(h1+t*(h2-h1), s1+t*(s2-s1), l1+t*(l2-l1));
  }

  const GREY = '#1e1e32';
  const ISL_COLOR = '#ef5350';

  /* TOP N FILTERING */
  function isVisible(iso) {
    if (iso === 'ISL') return true;
    const d = COUNTRIES[iso];
    if (!d) return false;
    if (currentView === 'cluster') return d.same_cluster;
    if (currentTopN === 0) return true;
    if (currentView === 'knn') return d.knn_rank <= currentTopN;
    if (currentView === 'correlation') return d.corr_rank <= currentTopN;
    if (currentView === 'combined') return d.overall_rank <= currentTopN;
    return false;
  }

  function getVisibleRange(key) {
    const visible = ALL_ISOS.filter(iso => isVisible(iso));
    if (visible.length === 0) return { min: 0, max: 1 };
    const vals = visible.map(iso => COUNTRIES[iso][key]);
    return { min: Math.min(...vals), max: Math.max(...vals) };
  }

  /* STYLE FUNCTIONS */
  const BASE = { weight: 0.7, opacity: 0.85, color: 'rgba(255,255,255,0.12)', fillOpacity: 0.75 };
  const ISL_STYLE = { ...BASE, fillColor: ISL_COLOR, fillOpacity: 0.95, weight: 2.5, color: '#ffcdd2' };
  const HIDDEN_STYLE = { ...BASE, fillColor: GREY, fillOpacity: 0.25 };

  function styleKnn(f) {
    const iso = f.id;
    if (iso === 'ISL') return ISL_STYLE;
    const d = COUNTRIES[iso];
    if (d && isVisible(iso)) {
      const range = getVisibleRange('knn_dist');
      const span = range.max - range.min || 1;
      const t = (d.knn_dist - range.min) / span;
      return { ...BASE, fillColor: lerpHSL(t, 210, 90, 30, 210, 40, 65) };
    }
    return HIDDEN_STYLE;
  }

  function styleCluster(f) {
    const iso = f.id;
    if (iso === 'ISL') return ISL_STYLE;
    const d = COUNTRIES[iso];
    if (d && d.same_cluster) return { ...BASE, fillColor: '#00897b', fillOpacity: 0.65 };
    return { ...BASE, fillColor: GREY, fillOpacity: 0.2 };
  }

  function styleCorr(f) {
    const iso = f.id;
    if (iso === 'ISL') return ISL_STYLE;
    const d = COUNTRIES[iso];
    if (d && isVisible(iso)) {
      const range = getVisibleRange('corr');
      const span = range.max - range.min || 0.01;
      const t = (d.corr - range.min) / span;
      return { ...BASE, fillColor: lerpHSL(t, 140, 45, 60, 150, 80, 28) };
    }
    return HIDDEN_STYLE;
  }

  function styleCombined(f) {
    const iso = f.id;
    if (iso === 'ISL') return ISL_STYLE;
    const d = COUNTRIES[iso];
    if (d && isVisible(iso)) {
      const t = 1 - d.combined;
      return { ...BASE, fillColor: hsl(0, 30 + t*50, 68 - t*38), fillOpacity: 0.35 + 0.55*t };
    }
    return { ...BASE, fillColor: GREY, fillOpacity: 0.18 };
  }

  const STYLES = { knn: styleKnn, cluster: styleCluster, correlation: styleCorr, combined: styleCombined };

  let pinLayer = L.layerGroup();
  const centroids = {};

  /* MAP */
  const map = L.map('map', {
    center: [25, 10], zoom: 2.4, minZoom: 2, maxZoom: 8,
    zoomControl: false, attributionControl: false, worldCopyJump: true
  });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  /* HELPERS */
  function fmtPop(n) {
    if (!n) return 'N/A';
    if (n >= 1e9) return (n/1e9).toFixed(2) + ' billion';
    if (n >= 1e6) return (n/1e6).toFixed(1) + ' million';
    if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
    return n.toString();
  }
  function getName(iso, geoName) { return NAME_OVERRIDES[iso] || geoName || iso; }

  /* INFO PANEL */
  const infoEl = document.getElementById('info-panel');
  const totalCountries = META.n_countries - 1;

  function updateInfo(iso, geoName) {
    const name = getName(iso, geoName);
    const pop = POPULATIONS[iso];
    const isIceland = iso === 'ISL';
    let html = '';

    if (currentView === 'knn') {
      const d = COUNTRIES[iso];
      if (isIceland) {
        html = '<div class="metric highlight">Reference country</div>';
      } else if (d) {
        const pct = Math.round((1 - (d.knn_rank - 1) / (totalCountries - 1)) * 100);
        html = `
          <div class="metric">KNN Distance: <strong>${d.knn_dist.toFixed(3)}</strong></div>
          <div class="metric-bar"><div style="width:${pct}%"></div></div>
          <div class="rank">Rank: #${d.knn_rank} of ${totalCountries}</div>`;
      } else {
        html = '<div class="metric muted">No data available</div>';
      }
    } else if (currentView === 'cluster') {
      const d = COUNTRIES[iso];
      if (isIceland) {
        html = `<div class="metric highlight">Reference country — Cluster ${META.isl_cluster}</div>`;
      } else if (d && d.same_cluster) {
        html = '<div class="metric" style="color:#80cbc4"><strong>Same cluster as Iceland</strong></div><div class="rank">Similar inflation trajectory</div>';
      } else {
        html = '<div class="metric muted">Different cluster from Iceland</div>';
      }
    } else if (currentView === 'correlation') {
      const d = COUNTRIES[iso];
      if (isIceland) {
        html = '<div class="metric highlight">Reference country (r = 1.000)</div>';
      } else if (d) {
        const pct = Math.round((1 - (d.corr_rank - 1) / (totalCountries - 1)) * 100);
        html = `
          <div class="metric">Correlation: <strong>r = ${d.corr.toFixed(4)}</strong></div>
          <div class="metric-bar green"><div style="width:${pct}%"></div></div>
          <div class="rank">Rank: #${d.corr_rank} of ${totalCountries}</div>`;
      } else {
        html = '<div class="metric muted">No data available</div>';
      }
    } else {
      const d = COUNTRIES[iso];
      if (isIceland) {
        html = '<div class="metric highlight">Reference country</div>';
      } else if (d) {
        const pct = Math.round((1 - d.combined) * 100);
        html = `
          <div class="metric">Combined Score: <strong>${d.combined.toFixed(4)}</strong></div>
          <div class="metric-bar red"><div style="width:${pct}%"></div></div>
          <div class="rank">Rank: #${d.overall_rank} of ${totalCountries} (lower = more similar)</div>
          ${d.methods_top30 >= 2 ? '<div class="badge">Multi-method match (' + d.methods_top30 + '/3)</div>' : ''}`;
      } else {
        html = '<div class="metric muted">No data available</div>';
      }
    }

    infoEl.innerHTML = `
      <h3>${name}</h3>
      <div class="info-iso">${iso}${isIceland ? ' — REFERENCE' : ''}</div>
      <div class="info-pop">Population: ${fmtPop(pop)}</div>
      <hr>
      ${html}`;
  }

  function clearInfo() {
    infoEl.innerHTML = '<h3>Hover over a country</h3><p class="default-hint">View similarity metrics</p>';
  }

  /* LEGEND */
  function updateLegend() {
    const el = document.getElementById('legend');

    if (currentView === 'cluster') {
      el.innerHTML = `
        <div class="legend-title">Cluster Membership (K=${META.optimal_k})</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#00897b"></span> Iceland's cluster (${META.isl_cluster_size} countries)</div>
        <div class="legend-item"><span class="legend-swatch" style="background:${GREY};opacity:0.6"></span> Other clusters</div>
        <div class="legend-item"><span class="legend-swatch" style="background:${ISL_COLOR}"></span> Iceland (reference)</div>`;
      return;
    }

    const showing = currentTopN === 0 ? 'all' : 'top ' + currentTopN;

    if (currentView === 'knn') {
      const range = getVisibleRange('knn_dist');
      el.innerHTML = `
        <div class="legend-title">KNN Euclidean Distance (${showing})</div>
        <div class="legend-gradient" style="background:linear-gradient(to right, ${lerpHSL(0,210,90,30,210,40,65)}, ${lerpHSL(0.5,210,90,30,210,40,65)}, ${lerpHSL(1,210,90,30,210,40,65)})"></div>
        <div class="legend-labels"><span>${range.min.toFixed(1)} (closest)</span><span>${range.max.toFixed(1)}</span></div>
        <div class="legend-item" style="margin-top:6px"><span class="legend-swatch" style="background:${GREY};opacity:0.5"></span> Not shown</div>
        <div class="legend-item"><span class="legend-swatch" style="background:${ISL_COLOR}"></span> Iceland</div>`;
    } else if (currentView === 'correlation') {
      const range = getVisibleRange('corr');
      el.innerHTML = `
        <div class="legend-title">Pearson Correlation (${showing})</div>
        <div class="legend-gradient" style="background:linear-gradient(to right, ${lerpHSL(0,140,45,60,150,80,28)}, ${lerpHSL(0.5,140,45,60,150,80,28)}, ${lerpHSL(1,140,45,60,150,80,28)})"></div>
        <div class="legend-labels"><span>${range.min.toFixed(3)}</span><span>${range.max.toFixed(3)} (highest)</span></div>
        <div class="legend-item" style="margin-top:6px"><span class="legend-swatch" style="background:${GREY};opacity:0.5"></span> Not shown</div>
        <div class="legend-item"><span class="legend-swatch" style="background:${ISL_COLOR}"></span> Iceland</div>`;
    } else {
      el.innerHTML = `
        <div class="legend-title">Combined Similarity (${showing})</div>
        <div class="legend-gradient" style="background:linear-gradient(to right, hsl(0,30%,68%), hsl(0,55%,49%), hsl(0,80%,30%))"></div>
        <div class="legend-labels"><span>Least similar</span><span>Most similar</span></div>
        <div class="legend-item" style="margin-top:6px"><span class="legend-swatch" style="background:${GREY};opacity:0.5"></span> Not shown</div>
        <div class="legend-item"><span class="legend-swatch" style="background:${ISL_COLOR}"></span> Iceland</div>`;
    }
  }

  /* METHOD INFO */
  function updateMethodInfo() {
    const n = currentTopN === 0 ? 'all' : currentTopN;
    const texts = {
      knn: `K-Nearest Neighbors: Euclidean distance on z-score standardized monthly CPI inflation (${META.window_start}–${META.window_end}, ${META.n_months} months). Showing ${n} closest countries.`,
      cluster: `K-Means Clustering (K=${META.optimal_k}) on standardized CPI. ${META.isl_cluster_size} countries share Iceland's inflation trajectory cluster. Silhouette score: ${META.silhouette_score}.`,
      correlation: `Pearson correlation of raw monthly CPI inflation (${META.window_start}–${META.window_end}). Showing ${n} most correlated countries.`,
      combined: `Combined score: average of normalized KNN rank, correlation rank, and cluster membership. Showing ${n} most similar countries.`
    };
    document.getElementById('method-text').textContent = texts[currentView];
  }

  function refreshMap() {
    if (geojsonLayer) geojsonLayer.setStyle(f => STYLES[currentView](f));
    updatePins();
    updateLegend();
    updateMethodInfo();
    clearInfo();
  }

  function computeCentroid(feature) {
    const coords = [];
    function extract(c, type) {
      if (type === 'Point') coords.push(c);
      else if (type === 'MultiPoint') c.forEach(p => coords.push(p));
      else if (type === 'Polygon') c[0].forEach(p => coords.push(p));
      else if (type === 'MultiPolygon') c.forEach(poly => poly[0].forEach(p => coords.push(p)));
    }
    extract(feature.geometry.coordinates, feature.geometry.type);
    if (coords.length === 0) return null;
    const lat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
    const lng = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    return [lat, lng];
  }

  function updatePins() {
    pinLayer.clearLayers();
    ALL_ISOS.forEach(iso => {
      if (!isVisible(iso) || iso === 'ISL') return;
      const c = centroids[iso];
      if (!c) return;
      L.circleMarker(c, {
        radius: 4, fillColor: '#fff', fillOpacity: 0.85,
        color: 'rgba(0,0,0,0.4)', weight: 1.5, interactive: false
      }).addTo(pinLayer);
    });
  }

  /* TAB SWITCHING */
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      if (view === currentView) return;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = view;
      document.getElementById('top-n-row').style.display = view === 'cluster' ? 'none' : 'flex';
      refreshMap();
    });
  });

  /* TOP N TOGGLE */
  document.querySelectorAll('.top-n-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.top-n-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTopN = parseInt(btn.dataset.n);
      refreshMap();
    });
  });

  /* PAGE TOGGLE */
  document.querySelectorAll('.page-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.dataset.page;
      if (page === currentPage) return;
      document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPage = page;

      document.getElementById('map').style.display = page === 'map' ? 'block' : 'none';
      document.getElementById('data-page').style.display = page === 'data' ? 'block' : 'none';

      ['info-panel', 'legend', 'method-info'].forEach(id => {
        document.getElementById(id).style.display = page === 'map' ? '' : 'none';
      });
      document.getElementById('view-tabs').style.display = page === 'map' ? 'flex' : 'none';
      document.getElementById('top-n-row').style.display =
        (page === 'map' && currentView !== 'cluster') ? 'flex' : 'none';

      if (page === 'data') {
        document.getElementById('data-page').scrollTop = 0;
        renderDataTable();
      }
    });
  });

  /* DATA TABLE */
  let sortCol = 'overall_rank';
  let sortDir = 'asc';
  let searchQuery = '';

  function renderDataSummary() {
    const topCorr = ALL_ISOS.reduce((best, iso) => {
      const d = COUNTRIES[iso];
      return (!best || d.corr > best.corr) ? { iso, ...d } : best;
    }, null);
    const topName = getName(topCorr.iso);

    document.getElementById('data-summary').innerHTML = `
      <div class="summary-stat"><div class="value">${totalCountries}</div><div class="label">Countries analyzed</div></div>
      <div class="summary-stat"><div class="value">${META.n_months}</div><div class="label">Months analyzed</div></div>
      <div class="summary-stat"><div class="value">K=${META.optimal_k}</div><div class="label">Optimal clusters (sil: ${META.silhouette_score})</div></div>
      <div class="summary-stat"><div class="value">${META.isl_cluster_size}</div><div class="label">Countries in Iceland's cluster</div></div>
      <div class="summary-stat"><div class="value">${topName}</div><div class="label">Most correlated (r=${topCorr.corr.toFixed(3)})</div></div>
    `;
  }

  function renderDataTable() {
    renderDataSummary();

    let rows = ALL_ISOS.map(iso => ({
      iso,
      name: getName(iso),
      ...COUNTRIES[iso]
    }));

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      rows = rows.filter(r => r.iso.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
    }

    rows.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (sortCol === 'name' || sortCol === 'iso') {
        return sortDir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
      }
      if (typeof va === 'boolean') { va = va ? 0 : 1; vb = vb ? 0 : 1; }
      return sortDir === 'asc' ? va - vb : vb - va;
    });

    document.getElementById('data-tbody').innerHTML = rows.map(r => `
      <tr class="${r.same_cluster ? 'cluster-match' : ''}">
        <td>${r.overall_rank}</td>
        <td>${r.name}</td>
        <td>${r.iso}</td>
        <td>${r.knn_rank}</td>
        <td>${r.knn_dist.toFixed(2)}</td>
        <td>${r.corr_rank}</td>
        <td>${r.corr.toFixed(4)}</td>
        <td>${r.same_cluster ? 'Same' : 'Diff'}</td>
        <td>${r.combined.toFixed(4)}</td>
        <td>${r.methods_top30}/3</td>
      </tr>
    `).join('');
  }

  document.querySelectorAll('#data-table th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = (col === 'name' || col === 'iso') ? 'asc' : 'asc';
      }
      document.querySelectorAll('#data-table th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
      th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      renderDataTable();
    });
  });

  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderDataTable();
  });

  /* GEOJSON LOADING */
  fetch(GEOJSON_URL)
    .then(r => r.json())
    .then(data => {
      geojsonLayer = L.geoJSON(data, {
        style: f => STYLES[currentView](f),
        onEachFeature: (feature, layer) => {
          const iso = feature.id;
          centroids[iso] = computeCentroid(feature);

          layer.on('mouseover', e => {
            const l = e.target;
            l.setStyle({ weight: 2.5, color: '#ffffff', fillOpacity: Math.min(l.options.fillOpacity + 0.2, 1) });
            l.bringToFront();
            updateInfo(iso, feature.properties.name);
          });

          layer.on('mouseout', e => {
            geojsonLayer.resetStyle(e.target);
            clearInfo();
          });

          layer.on('click', e => {
            map.fitBounds(e.target.getBounds(), { padding: [60, 60], maxZoom: 6 });
          });

          const name = getName(iso, feature.properties.name);
          layer.bindTooltip(name, {
            sticky: true, className: 'country-tooltip',
            direction: 'top', offset: [0, -10]
          });
        }
      }).addTo(map);

      pinLayer.addTo(map);
      updatePins();

      // Iceland pulsing marker
      const icelandIcon = L.divIcon({
        className: '',
        html: '<div class="iceland-pin"><div class="ring"></div><div class="ring"></div><div class="core"></div></div>',
        iconSize: [22, 22], iconAnchor: [11, 11]
      });
      L.marker(ICELAND_COORDS, { icon: icelandIcon, zIndexOffset: 1000, interactive: false }).addTo(map);

      updateLegend();
      updateMethodInfo();
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 300);
    })
    .catch(err => {
      document.getElementById('loading').innerHTML =
        '<div style="color:#ef5350;font-size:1.1rem;font-weight:600;">Failed to load map data</div>' +
        '<div style="color:rgba(255,255,255,0.4);margin-top:8px;">Check internet connection and reload.</div>';
      console.error('GeoJSON fetch failed:', err);
    });

  </script>
</body>
</html>
