<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Card Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    
    <header>
        <div class="header-content">
            <a href="Index.html?main=true" class="logo" aria-label="Portfolio home">
                <svg viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
                Portfolio
            </a>
            <button class="new-look-btn" onclick="randomNewLook()" aria-label="Try a new look">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2v2c3.86 0 7 3.14 7 7s-3.14 7-7 7-7-3.14-7-7c0-1.07.24-2.08.67-3H3.09c-.5 1.39-.79 2.88-.79 4.42 0 5.52 4.48 10 10 10s10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-.29.02-.58.05-.86l2.03-2.03C6.98 10.15 7 11.08 7 12c0 2.76 2.24 5 5 5s5-2.24 5-5-2.24-5-5-5c-.92 0-1.76.26-2.5.67L7.91 6.08C9.08 5.37 10.5 5 12 5c3.86 0 7 3.14 7 7s-3.14 7-7 7z"/>
                </svg>
                New Look
            </button>
        </div>
    </header>

    <div class="filter-bar" role="region" aria-label="Project filters">
        <div class="filter-content">
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input 
                    type="search" 
                    class="search-input" 
                    placeholder="Search projects..." 
                    aria-label="Search projects"
                    id="project-search"
                >
                <button class="search-clear" aria-label="Clear search" type="button">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div class="filter-group">
                <span class="filter-label">Category:</span>
                <div class="filter-buttons" role="group">
                    <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                    <button class="filter-btn" data-filter="game" aria-pressed="false">Games</button>
                    <button class="filter-btn" data-filter="visualization" aria-pressed="false">Visualizations</button>
                    <button class="filter-btn" data-filter="interactive" aria-pressed="false">Interactive</button>
                </div>
            </div>
        </div>
    </div>

    <main id="main" class="main-content">
        <h1 class="page-title">Creative Projects</h1>
        <p class="page-subtitle">Explore a collection of interactive web experiences and experiments</p>

        <div class="projects-grid" role="list" id="projects-container">
            <!-- Projects will be dynamically loaded here -->
        </div>
    </main>

    <footer>
        <p>© 2025 • Built with modern web technologies</p>
    </footer>

    <script>
        // Global variables
        let projectCards = [];
        let currentFilter = 'all';
        let searchQuery = '';
        
        const searchInput = document.getElementById('project-search');
        const searchClear = document.querySelector('.search-clear');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const projectsContainer = document.getElementById('projects-container');

        // SVG Icon generator
        function getIconSVG(iconType) {
            const icons = {
                gamepad: '<path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>',
                chart: '<path d="M3 3v18h18v-2H5V3H3zm14 12.59V8l-6 6-3-3-4 4v1.17L8 12.17l3 3 6-6z"/>',
                dice: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM6.5 9L10 5.5 13.5 9 11 9v4c0 1.1-.9 2-2 2s-2-.9-2-2v-4H6.5zm11 6L14 18.5 10.5 15H13v-4c0-1.1.9-2 2-2s2 .9 2 2v4h.5z"/>',
                speaker: '<path d="M5 9v6h4l5 5V4l-5 5H5zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16 12c0 .14-.01.28-.04.42L15.96 12h-.01c0-1.1-.9-2-2-2s-2 .9-2 2-.9 2-2 2H6c-1.1 0-2-.9-2-2s.9-2 2-2h3.95c.56-1.19 1.83-2 3.05-2s2.49.81 3.05 2H20c1.1 0 2 .9 2 2s-.9 2-2 2h-4z"/>',
                tree: '<path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>',
                mic: '<path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>',
                default: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>'
            };
            return icons[iconType] || icons.default;
        }

        // Generate a single project card
        function generateProjectCard(project, index) {
            const card = document.createElement('article');
            card.className = `project-card${project.featured ? ' featured' : ''}`;
            card.style.setProperty('--i', index);
            card.setAttribute('role', 'listitem');
            card.dataset.category = project.categories.join(' ');
            
            // Generate tag HTML
            const tagsHTML = project.tags.map(tag => {
                const tagClass = tag.toLowerCase().replace(/\s+/g, '-');
                return `<span class="tag tag-${tagClass}">${tag}</span>`;
            }).join('');
            
            // Add Featured tag if applicable
            const featuredTag = project.featured ? '<span class="tag">Featured</span>' : '';
            
            // Generate technologies HTML
            const techHTML = project.technologies.map((tech, i) => 
                i === 0 ? `<span>${tech}</span>` : `<span>•</span><span>${tech}</span>`
            ).join('');
            
            // Determine link text based on project type
            const linkText = project.categories.includes('game') ? 'Play Now' : 'Explore';
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-pattern"></div>
                    <svg class="card-icon" viewBox="0 0 24 24">
                        ${getIconSVG(project.icon)}
                    </svg>
                </div>
                <div class="card-body">
                    <div class="project-tags">
                        ${tagsHTML}
                        ${featuredTag}
                    </div>
                    <h2 class="project-title">${project.title}</h2>
                    <p class="project-description">${project.description}</p>
                    <div class="card-footer">
                        <a href="${project.path}" class="project-link" aria-label="${linkText} ${project.title}">
                            ${linkText}
                            <svg viewBox="0 0 24 24">
                                <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </a>
                        <div class="project-stats">
                            ${techHTML}
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        // Load projects from JSON
        async function loadProjects() {
            try {
                const response = await fetch('projects.json');
                const data = await response.json();
                
                // Clear existing content
                projectsContainer.innerHTML = '';
                
                // Sort projects so featured comes first
                const sortedProjects = data.projects.sort((a, b) => {
                    if (a.featured && !b.featured) return -1;
                    if (!a.featured && b.featured) return 1;
                    return 0;
                });
                
                // Generate and add cards
                sortedProjects.forEach((project, index) => {
                    const card = generateProjectCard(project, index);
                    projectsContainer.appendChild(card);
                });
                
                // Update global projectCards reference
                projectCards = document.querySelectorAll('.project-card');
                
                // Initialize filters
                initializeFilters();
                
            } catch (error) {
                console.error('Error loading projects:', error);
                projectsContainer.innerHTML = '<p>Error loading projects. Please refresh the page.</p>';
            }
        }

        // Initialize filter functionality
        function initializeFilters() {
            // Re-attach event listeners for dynamically loaded cards
            filterProjects();
        }

        // Search functionality
        function performSearch() {
            searchQuery = searchInput.value.toLowerCase().trim();
            filterProjects();
            
            // Show/hide clear button
            if (searchQuery) {
                searchClear.classList.add('visible');
            } else {
                searchClear.classList.remove('visible');
            }
        }

        // Combined filter function
        function filterProjects() {
            let visibleIndex = 0;
            
            projectCards.forEach(card => {
                const category = card.dataset.category;
                const title = card.querySelector('.project-title').textContent.toLowerCase();
                const description = card.querySelector('.project-description').textContent.toLowerCase();
                const tags = Array.from(card.querySelectorAll('.tag')).map(tag => tag.textContent.toLowerCase());
                
                // Check category filter
                const matchesCategory = currentFilter === 'all' || category.includes(currentFilter);
                
                // Check search query
                const matchesSearch = !searchQuery || 
                    title.includes(searchQuery) || 
                    description.includes(searchQuery) ||
                    tags.some(tag => tag.includes(searchQuery));
                
                // Show/hide based on both filters
                if (matchesCategory && matchesSearch) {
                    card.style.display = 'flex';
                    card.style.setProperty('--i', visibleIndex++);
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Search input events
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('search', performSearch);

        // Clear search
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.classList.remove('visible');
            filterProjects();
            searchInput.focus();
        });

        // Category filter functionality
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active state
                filterBtns.forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');

                // Update filter and apply
                currentFilter = btn.dataset.filter;
                filterProjects();
            });
        });

        // Keyboard navigation for search
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchQuery) {
                searchInput.value = '';
                searchQuery = '';
                searchClear.classList.remove('visible');
                filterProjects();
            }
        });

        // New Look functionality
        function randomNewLook() {
            // Get current index number from filename
            const currentPath = window.location.pathname;
            const currentIndex = parseInt(currentPath.match(/index(\d)\.html/)?.[1] || '2');
            
            // Array of available indices (excluding current)
            const indices = [1, 2, 3, 4, 5, 6].filter(i => i !== currentIndex);
            
            // Select a random index
            const randomIndex = indices[Math.floor(Math.random() * indices.length)];
            
            // Navigate to the new index
            window.location.href = `index${randomIndex}.html`;
        }
        
        // Load projects when page loads
        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
